
name: Tomcat CI/CD Pipeline

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build WAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maven Build
        run: mvn clean package

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: application-war
          path: target/*.war

  deploy-dev:
    name: Deploy DEV
    needs: build
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: dev
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

  deploy-qa:
    name: Deploy QA
    needs: deploy-dev
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: qa
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

  deploy-prod:
    name: Deploy PROD
    needs: deploy-qa
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: prod
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
