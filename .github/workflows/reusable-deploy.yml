name: Reusable Tomcat Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: string

    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SSH_KNOWN_HOSTS:
        required: true

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    env:
      TOMCAT_HOST: ${{ vars.TOMCAT_HOST }}
      TOMCAT_USER: ${{ vars.TOMCAT_USER }}
      TOMCAT_WEBAPPS: ${{ vars.TOMCAT_WEBAPPS }}
      TOMCAT_SERVICE: ${{ vars.TOMCAT_SERVICE }}
      APP_URL: ${{ vars.APP_URL }}
      APP_NAME: ${{ vars.APP_NAME }}

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: application-war
          path: ./artifact

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy WAR
        run: |
          scp -i ~/.ssh/id_rsa \
            ./artifact/*.war \
            "$TOMCAT_USER@$TOMCAT_HOST:/tmp/$APP_NAME.war"

      - name: Deploy Application
        run: |
          ssh -i ~/.ssh/id_rsa "$TOMCAT_USER@$TOMCAT_HOST" \
            "sudo systemctl stop '$TOMCAT_SERVICE' &&
             if [ -f '$TOMCAT_WEBAPPS/$APP_NAME.war' ]; then
               sudo cp '$TOMCAT_WEBAPPS/$APP_NAME.war' \
                 '$TOMCAT_WEBAPPS/$APP_NAME.war.backup';
             fi &&
             sudo install -m 0644 /tmp/$APP_NAME.war \
               '$TOMCAT_WEBAPPS/$APP_NAME.war' &&
             sudo systemctl start '$TOMCAT_SERVICE' &&
             rm -f /tmp/$APP_NAME.war"

      - name: Health Check
        run: |
          for i in {1..12}; do
            if curl -fsS "$APP_URL"; then
              echo "Application is healthy"
              exit 0
            fi
            sleep 10
          done

          echo "Application health check failed"
          exit 1

